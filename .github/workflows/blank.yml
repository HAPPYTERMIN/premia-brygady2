name: Budowa APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Budowanie aplikacji Android
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie projektu
        uses: actions/checkout@v4

      - name: Instalacja JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Konfiguracja Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Uprawnienia dla gradlew
        run: chmod +x gradlew

      - name: Budowanie APK
        run: ./gradlew assembleDebug

      - name: Udostępnienie APK
        uses: actions/upload-artifact@v4
        with:
          name: Premia-Brygady-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
